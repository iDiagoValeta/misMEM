name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Publishing must be gated on the same checks as CI (typecheck, tests, build, scripts).
  ci:
    uses: ./.github/workflows/ci.yml
    # The tests never need to write packages; only build-push does.
    permissions:
      contents: read

  build-push:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Hacen falta todos los tags para saber si este es el más nuevo.
          fetch-depth: 0
      - id: highest
        name: tag estable más alto del repo
        # Las pre-releases quedan afuera del cálculo: con un v9.9.9-rc1 suelto ordenando
        # primero, el siguiente release estable se quedaría sin `latest`.
        run: |
          echo "tag=$(git tag --list 'v*' --sort=-v:refname | awk '!/-/' | head -1)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mismem-brain
          # `latest` no sale de cualquier tag: un v0.4.0 puesto en retrospectiva
          # publicaría el árbol viejo encima del último release. Sale del tag más
          # alto, nunca de una pre-release, y de una corrida manual (para republicar).
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') && (github.event_name == 'workflow_dispatch' || github.ref_name == steps.highest.outputs.tag) }}
      - uses: docker/build-push-action@v6
        with:
          context: engine
          file: engine/Dockerfile.mismem-brain
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
