name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; build-push alone gets packages: write.
permissions:
  contents: read

jobs:
  # A branch run would push a branch-named image. Dispatch exists to republish a release,
  # so it must start from a tag; this job fails before the CI suite spends any minutes.
  release-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require a release tag
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Run this workflow from a v* tag (got $REF). Select the tag in 'Use workflow from' to republish a release."
          exit 1

  # Publishing must be gated on the same checks as CI (typecheck, tests, build, scripts).
  ci:
    needs: release-ref
    uses: ./.github/workflows/ci.yml
    # The tests never need to write packages; only build-push does.
    permissions:
      contents: read

  build-push:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Hacen falta todos los tags para saber si este es el más nuevo.
          fetch-depth: 0
      - id: highest
        name: tag estable más alto del repo
        # Las pre-releases quedan afuera del cálculo: con un v9.9.9-rc1 suelto ordenando
        # primero, el siguiente release estable se quedaría sin `latest`.
        run: |
          echo "tag=$(git tag --list 'v*' --sort=-v:refname | awk '!/-/' | head -1)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/mismem-brain
          # `latest` no sale de cualquier tag: un v0.4.0 puesto en retrospectiva
          # publicaría el árbol viejo encima del último release. Sale del tag más
          # alto, nunca de una pre-release, y de una corrida manual (para republicar).
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && (github.event_name == 'workflow_dispatch' || github.ref_name == steps.highest.outputs.tag) }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: engine
          file: engine/Dockerfile.mismem-brain
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
