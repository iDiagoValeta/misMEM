name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Lets docker.yml run this exact suite before publishing an image: a tag must not
  # ship code that the main CI would have rejected.
  workflow_call:

# Least privilege by default: nothing in here writes to the repo or to packages.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    name: node-${{ matrix.node-version }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No later step pushes, so the token does not need to stay in .git/config.
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: engine/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: engine/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Fails on unused files, exports and dependencies, so dead code cannot come back unnoticed.
      - run: pnpm knip
      - run: pnpm build

  scripts:
    # Nothing else parses the shell scripts, so a syntax error would only show up
    # on a user's machine. shellcheck is limited to errors to avoid style noise.
    runs-on: ubuntu-latest
    name: shell-scripts
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No later step pushes, so the token does not need to stay in .git/config.
          persist-credentials: false
      - run: bash -n scripts/*.sh
      - run: shellcheck --severity=error scripts/*.sh

  docker-build:
    # A broken Dockerfile would otherwise only surface when a tag is pushed. Pull
    # requests only; the release run (workflow_call from docker.yml) builds for real.
    # No registry login and no cache writes, so it needs nothing beyond contents: read.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: engine
          file: engine/Dockerfile.mismem-brain
          # amd64 only: the arm64 emulated build is slow and is covered at release time.
          platforms: linux/amd64
          push: false
          cache-from: type=gha

  workflow-lint:
    # Workflows run with our token, so lint them like code: actionlint for correctness,
    # zizmor for security (unpinned actions, token scope, template injection).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - run: pipx run 'zizmor==1.*' --min-severity medium .github/workflows
