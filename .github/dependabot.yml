version: 2

# Same shape as the owner's other repos: weekly on Monday, minor and patch grouped so a
# review is one CI run, majors on their own because they are the ones that need reading.
updates:
  - package-ecosystem: npm
    directory: /engine
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      engine-minor:
        patterns: ["*"]
        update-types: [minor, patch]

  # Actions are pinned by SHA: Dependabot moves the SHA and its version comment together,
  # which is the only way a pinned workflow ever gets an update.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  # node:22-alpine is pinned by digest in the Dockerfile; nothing else would bump it,
  # so a CVE fix in the base image would wait for a manual rebuild.
  - package-ecosystem: docker
    directory: /engine
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
