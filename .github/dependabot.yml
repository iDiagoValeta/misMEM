version: 2
updates:
  # Minor and patch arrive as one PR so a review covers the whole bump instead of a
  # queue of one-line PRs; majors stay separate because they need a decision.
  - package-ecosystem: npm
    directory: /engine
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # Actions are pinned by SHA: Dependabot moves the SHA and its version comment together,
  # which is the only way a pinned workflow ever gets an update.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # node:22-alpine is the one dependency nothing in the repo bumps, so a CVE fix in the
  # base image would otherwise wait for a manual rebuild.
  - package-ecosystem: docker
    directory: /engine
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
