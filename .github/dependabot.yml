version: 2

# Same shape as the owner's other repos: weekly on Monday. npm groups minor and patch so a
# review is one CI run and keeps majors apart; action bumps all travel in one PR.
# cooldown: only releases at least 14 days old, the repo's supply-chain minimum.
updates:
  - package-ecosystem: npm
    directory: /engine
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      engine-minor:
        patterns: ["*"]
        update-types: [minor, patch]

  # Actions are pinned by SHA: Dependabot moves the SHA and its version comment together,
  # which is the only way a pinned workflow ever gets an update.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  # node:22-alpine is pinned by digest in the Dockerfile; nothing else would bump it,
  # so a CVE fix in the base image would wait for a manual rebuild.
  - package-ecosystem: docker
    directory: /engine
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
