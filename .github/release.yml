# Groups the notes GitHub generates for a release by the labels the issue standard
# declares (.github/labels.json). A PR with no matching label lands in "Otros cambios":
# label it, do not edit this file to catch it. Every list is flow style on one line so
# engine/tests/contribution-standard.test.ts can check each name against labels.json.
changelog:
  exclude:
    labels: [wontfix, duplicate, invalid]
  categories:
    - title: Cambios incompatibles
      labels: [breaking]
    - title: Seguridad
      labels: [security]
    - title: Correcciones
      labels: [bug]
    - title: Novedades y cambios
      labels: [enhancement, performance]
    - title: Documentación
      labels: [documentation]
    - title: Limpieza e investigación
      labels: [cleanup, research]
    - title: Dependencias
      labels: [dependencies]
    - title: Otros cambios
      labels: ["*"]
